<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Positivus</title>
  </head>
  <body>
    <section class="landing">
      <header class="header">
        <img src="./images/full-logo.svg" alt="logo" class="header__logo" />
        <nav class="header__nav">
          <ul class="header__nav__list">
            <li class="header__nav__list__item">
              <a href="#">About Us</a>
            </li>
            <li class="header__nav__list__item">
              <a href="#">Services</a>
            </li>
            <li class="header__nav__list__item">
              <a href="#">Use cases</a>
            </li>
            <li class="header__nav__list__item">
              <a href="#">Pricing</a>
            </li>
            <li class="header__nav__list__item">
              <a href="#">Blog</a>
            </li>
            <li class="header__nav__list__item">
              <a href="#">
                <button class="btn-outline">Request a quote</button>
              </a>
            </li>
          </ul>
        </nav>
      </header>
      <section class="hero">
        <div class="hero__content">
          <h1 class="hero__content__heading">
            Navigating the digital landscape for success
          </h1>
          <p class="hero__content_p">
            Our digital marketing agency helps businesses grow and succeed
            online through a range of services including SEO, PPC, social media
            marketing, and content creation.
          </p>
          <button class="btn-secondary">Book a consultation</button>
        </div>
        <img src="./images/hero-image.svg" class="hero__image" alt="" />
      </section>
    </section>
  </body>
</html>
