<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script defer src="./geolocationAPI.js"></script>
  <body>
    <button id="get-location-btn">Get my location</button>
    <div
      style="
        left: 0;
        width: 100%;
        height: 0;
        position: relative;
        padding-bottom: 75%;
      "
    >
      <iframe
        id="osm-map-iframe"
        src="https://www.openstreetmap.org/export/embed.html?marker=32.74553345603638,-96.80512635678575"
        style="
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          position: absolute;
          border: 0;
        "
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
